name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install C Compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang build-essential

      - name: Install dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" --no-build-isolation

      - name: Run automated test suite
        run: |
          pytest tests/ -v

      - name: Run reproducible smoke-test
        run: |
          python -m chebyshev.cli --smoke-test --seed 42

      - name: Verify strict C99 compliance
        if: runner.os == 'Linux'
        run: |
          gcc -x c -std=c99 -Wall -Wextra -Werror -pedantic -fsyntax-only cheb_out/chebyshev_engine.h
          clang -x c -std=c99 -Wall -Wextra -Werror -pedantic -fsyntax-only cheb_out/chebyshev_engine.h
